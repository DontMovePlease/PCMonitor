<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>Unlock Rovarin</title>
  <meta name="application-name" content="Rovarin">
  <meta name="apple-mobile-web-app-title" content="Rovarin">
  <link rel="stylesheet" href="/app.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      text-align: center;
    }
    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }
    .login-icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }
    .pin-input {
      width: 100%;
      font-size: 28px;
      letter-spacing: 12px;
      text-align: center;
      padding: 14px 16px;
      background: rgba(10, 14, 23, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: #fff;
      margin: 20px 0;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .pin-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }
    .login-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .error-msg {
      color: #f43f5e;
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body class="dark-theme">
  <div class="native-app-bar" aria-label="Rovarin application"><div class="native-app-identity"><span>Rovarin</span></div></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Rovarin</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 8px;">Your PC in your pocket.</p>
      <input type="password" id="pinInput" class="pin-input" pattern="[0-9]{6}|[0-9]{12}" inputmode="numeric" placeholder="••••••" maxlength="12" autofocus aria-label="Rovarin PIN (6 digits, or legacy 12 digits)">
      <button id="unlockBtn" class="login-btn">Unlock Dashboard</button>
      <div id="errMsg" class="error-msg"></div>
    </div>
  </div>
  <script src="/login.js" defer></script>
</body>
</html>
